services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dgtlz
      POSTGRES_PASSWORD: dgtlz
      POSTGRES_DB: dgtlz
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgtlz"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dgtlz:dgtlz@postgres:5432/dgtlz?schema=public
      REDIS_URL: redis://redis:6379
      GATEWAY_PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dgtlz:dgtlz@postgres:5432/dgtlz?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dgtlz:dgtlz@postgres:5432/dgtlz?schema=public
      REDIS_URL: redis://redis:6379
      GATEWAY_URL: http://gateway:4000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
